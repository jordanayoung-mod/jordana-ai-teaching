name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on with source GitHub Actions when this token is allowed to.
          # The default GITHUB_TOKEN often cannot do this. If the step fails,
          # set Settings > Pages > Build and deployment > Source to GitHub Actions.
          enablement: true

      - name: Copy site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'package-lock.json' \
            ./ _site/
          test -f _site/index.html
          test -f _site/config.js
          test -f _site/data/inventory.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
